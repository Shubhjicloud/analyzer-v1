<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shubh AI v1 – Wingo Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0B0B1A;
      color: #FFFFFF;
      min-height: 100vh;
      overflow: hidden;
    }

    .main-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: #0B0B1A;
      position: relative;
    }

    /* ===== TRADING SITE ===== */
    .trading-site {
      flex: 1;
      height: 100vh;
      overflow: hidden;
    }
    .trading-site iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ===== ANALYZER OVERLAY (Movable) ===== */
    .analyzer-overlay {
      position: fixed;
      top: 50%;
      left: auto;
      right: 10px;
      transform: translateY(-50%);
      width: 250px;
      max-height: 80vh;
      height: auto;
      background: #0B0B1A;
      border: 2px solid rgba(0, 255, 195, 0.3);
      box-shadow: -4px 0 30px rgba(0, 255, 195, 0.1);
      z-index: 1000;
      padding: 12px;
      overflow-y: auto;
      transition: max-height 0.3s ease;
      border-radius: 16px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .analyzer-overlay:active { cursor: grabbing; }

    /* ✅ Minimized State */
    .analyzer-overlay.minimized {
      max-height: 50px;
      overflow: hidden;
      width: 250px;
      cursor: pointer;
      border-color: rgba(0, 255, 195, 0.1);
    }
    .analyzer-overlay.minimized .panel-header {
      border-bottom: none;
      padding: 6px 0;
    }
    .analyzer-overlay.minimized .panel-header h1 { font-size: 12px; }

    /* ===== MINIMIZE BUTTON (Cross) ===== */
    .toggle-btn {
      position: absolute;
      top: -14px;
      right: 14px;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }
    .toggle-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(255, 107, 107, 0.5);
    }

    /* ===== EXPAND BUTTON (Green Tick) ===== */
    .expand-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, #00ffc3, #00b894);
      color: #0B0B1A;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 32px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 255, 195, 0.5);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      animation: pulse-glow 1.5s infinite;
    }
    .expand-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 0 60px rgba(0, 255, 195, 0.8);
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 20px rgba(0, 255, 195, 0.3); }
      50% { box-shadow: 0 0 50px rgba(0, 255, 195, 0.7); }
      100% { box-shadow: 0 0 20px rgba(0, 255, 195, 0.3); }
    }

    /* ===== DRAG HANDLE ===== */
    .drag-handle {
      width: 100%;
      height: 30px;
      background: transparent;
      cursor: grab;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
      border-radius: 16px 16px 0 0;
    }
    .drag-handle:active { cursor: grabbing; }

    /* ===== SCROLLBAR ===== */
    .analyzer-overlay::-webkit-scrollbar { width: 2px; }
    .analyzer-overlay::-webkit-scrollbar-track { background: #0B0B1A; }
    .analyzer-overlay::-webkit-scrollbar-thumb { background: #00ffc3; border-radius: 10px; }

    /* ===== AUTH SECTION ===== */
    .auth-section {
      background: rgba(0, 255, 195, 0.04);
      border-radius: 12px;
      padding: 14px 12px;
      border: 1px solid rgba(0, 255, 195, 0.15);
      text-align: center;
      margin-top: 10px;
    }
    .auth-section h3 { font-size: 14px; color: #00ffc3; margin-bottom: 2px; }
    .auth-section p { font-size: 11px; color: #A7A9BE; margin-bottom: 10px; }
    .auth-section input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 195, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 13px;
      outline: none;
      margin-bottom: 8px;
    }
    .auth-section input:focus {
      border-color: #00ffc3;
      box-shadow: 0 0 20px rgba(0, 255, 195, 0.2);
    }
    .auth-section .neon-btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #00ffc3, #00b894);
      color: #0B0B1A;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(0, 255, 195, 0.3);
    }
    .auth-section .neon-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(0, 255, 195, 0.5);
    }
    .auth-section .msg-status { font-size: 11px; margin-top: 6px; display: none; }
    .auth-section .msg-status.success { color: #00ffc3; display: block; }
    .auth-section .msg-status.error { color: #ff6b6b; display: block; }

    #analyzerContent { display: none; }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0, 255, 195, 0.2);
    }
    .panel-header h1 {
      font-size: 14px;
      font-weight: 900;
      background: linear-gradient(135deg, #00ffc3, #00b894);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .panel-header .badge { font-size: 8px; background: rgba(0, 255, 195, 0.15); color: #00ffc3; padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(0, 255, 195, 0.3); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 8px 0; }
    .stat-card { background: rgba(0, 255, 195, 0.04); padding: 8px 4px; border-radius: 10px; text-align: center; border: 1px solid rgba(0, 255, 195, 0.1); }
    .stat-card .num { font-size: 18px; font-weight: 800; }
    .stat-card .num.big { color: #FF8906; }
    .stat-card .num.small { color: #00ffc3; }
    .stat-card .num.total { color: #A7A9BE; }
    .stat-card .label { font-size: 9px; color: #A7A9BE; }

    .history-box { background: rgba(0, 255, 195, 0.03); border-radius: 10px; padding: 10px; border: 1px solid rgba(0, 255, 195, 0.08); margin-bottom: 10px; }
    .history-box h4 { font-size: 10px; color: #A7A9BE; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .history-numbers { display: flex; gap: 4px; flex-wrap: wrap; }
    .history-numbers .ball { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: #fff; background: #2D2D44; }
    .history-numbers .ball.small { background: #00ffc3; color: #0B0B1A; }
    .history-numbers .ball.big { background: #FF8906; }

    .prediction-box { background: linear-gradient(135deg, rgba(0, 255, 195, 0.08), rgba(0, 184, 148, 0.05)); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid rgba(0, 255, 195, 0.2); margin-bottom: 10px; }
    .prediction-box .pred-label { font-size: 10px; color: #A7A9BE; }
    .prediction-box .pred-value { font-size: 28px; font-weight: 900; margin: 2px 0; }
    .prediction-box .pred-value.big { color: #FF8906; }
    .prediction-box .pred-value.small { color: #00ffc3; }
    .prediction-box .pred-confidence { font-size: 10px; color: #A7A9BE; }
    .prediction-box .pred-confidence span { color: #00ffc3; font-weight: 700; }
    .period-info { font-size: 10px; color: #A7A9BE; margin-top: 2px; }
    .period-info span { color: #00ffc3; font-weight: 600; }

    @media (max-width: 480px) {
      .analyzer-overlay { width: 200px; right: 4px; max-height: 70vh; padding: 8px; }
      .analyzer-overlay.minimized { width: 200px; max-height: 40px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 2px; }
      .stat-card .num { font-size: 14px; }
      .history-numbers .ball { width: 22px; height: 22px; font-size: 9px; }
      .prediction-box .pred-value { font-size: 22px; }
      .toggle-btn { width: 30px; height: 30px; font-size: 14px; top: -12px; right: 10px; }
      .expand-btn { width: 50px; height: 50px; font-size: 26px; bottom: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- ===== TRADING SITE (HTTPS FIX) ===== -->
    <div class="trading-site">
      <iframe src="https://www.tashanwin.cc/#/register?invitationCode=48383155780" allowfullscreen loading="lazy"></iframe>
    </div>

    <!-- ===== ANALYZER OVERLAY ===== -->
    <div class="analyzer-overlay" id="analyzerOverlay">

      <!-- Drag Handle -->
      <div class="drag-handle" id="dragHandle"></div>

      <!-- Minimize Button -->
      <button class="toggle-btn" id="toggleBtn">✕</button>

      <!-- Header -->
      <div class="panel-header">
        <h1>⚡ Shubh AI v1</h1>
        <span class="badge">● LIVE</span>
      </div>

      <!-- ===== AUTH SECTION ===== -->
      <div class="auth-section" id="authSection">
        <div id="stepRegister">
          <h3>🔐 Register</h3>
          <p>Enter username</p>
          <input type="text" id="usernameInput" placeholder="Username" />
          <button class="neon-btn" id="registerBtn">Register</button>
          <div class="msg-status" id="registerStatus"></div>
        </div>
        <div id="stepUid" style="display:none;">
          <h3>🔑 Enter UID</h3>
          <p>Enter your unique UID</p>
          <input type="text" id="uidInput" placeholder="UID (e.g., 12345)" />
          <button class="neon-btn" id="uidBtn">Verify UID</button>
          <div class="msg-status" id="uidStatus"></div>
        </div>
        <div id="stepPassword" style="display:none;">
          <h3>🔑 Enter Password</h3>
          <p>Enter game password</p>
          <input type="password" id="passwordInput" placeholder="Password" />
          <button class="neon-btn" id="passwordBtn">Unlock</button>
          <div class="msg-status" id="passwordStatus"></div>
        </div>
      </div>

      <!-- ===== ANALYZER CONTENT ===== -->
      <div id="analyzerContent">
        <div class="stats">
          <div class="stat-card"><div class="num big" id="bigCount">0</div><div class="label">Big</div></div>
          <div class="stat-card"><div class="num small" id="smallCount">0</div><div class="label">Small</div></div>
          <div class="stat-card"><div class="num total" id="totalCount">0</div><div class="label">Total</div></div>
        </div>
        <div class="history-box">
          <h4>📜 Last Results <span style="color:#00ffc3;font-size:8px;">● LIVE</span></h4>
          <div class="history-numbers" id="historyContainer"><span style="color:#A7A9BE;font-size:10px;">Loading...</span></div>
        </div>
        <div class="prediction-box">
          <div class="pred-label">🎯 Next Prediction <span style="font-size:8px;color:#00ffc3;">Shubh AI</span></div>
          <div class="pred-value" id="prediction">—</div>
          <div class="pred-confidence">Confidence: <span id="confidence">0%</span></div>
          <div class="period-info">Next: <span id="nextPeriod">—</span></div>
        </div>
      </div>

    </div>

    <!-- ===== EXPAND BUTTON (GREEN TICK) ===== -->
    <button class="expand-btn" id="expandBtn">✅</button>

  </div>

  <script>
    // ============================================================
    //  DRAG / MOVE ANALYZER
    // ============================================================
    const overlay = document.getElementById('analyzerOverlay');
    const dragHandle = document.getElementById('dragHandle');
    let isDragging = false;
    let offsetX = 0, offsetY = 0;

    dragHandle.addEventListener('mousedown', function(e) {
      isDragging = true;
      const rect = overlay.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      overlay.style.cursor = 'grabbing';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      let x = e.clientX - offsetX;
      let y = e.clientY - offsetY;
      const maxX = window.innerWidth - overlay.offsetWidth - 10;
      const maxY = window.innerHeight - overlay.offsetHeight - 10;
      x = Math.max(10, Math.min(x, maxX));
      y = Math.max(10, Math.min(y, maxY));
      overlay.style.left = x + 'px';
      overlay.style.right = 'auto';
      overlay.style.top = y + 'px';
      overlay.style.transform = 'none';
    });

    document.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        overlay.style.cursor = 'grab';
      }
    });

    // Touch support
    dragHandle.addEventListener('touchstart', function(e) {
      const touch = e.touches[0];
      const rect = overlay.getBoundingClientRect();
      offsetX = touch.clientX - rect.left;
      offsetY = touch.clientY - rect.top;
      isDragging = true;
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      const touch = e.touches[0];
      let x = touch.clientX - offsetX;
      let y = touch.clientY - offsetY;
      const maxX = window.innerWidth - overlay.offsetWidth - 10;
      const maxY = window.innerHeight - overlay.offsetHeight - 10;
      x = Math.max(10, Math.min(x, maxX));
      y = Math.max(10, Math.min(y, maxY));
      overlay.style.left = x + 'px';
      overlay.style.right = 'auto';
      overlay.style.top = y + 'px';
      overlay.style.transform = 'none';
    }, { passive: false });

    document.addEventListener('touchend', function() {
      isDragging = false;
    });

    // ============================================================
    //  TOGGLE MINIMIZE + EXPAND (Green Tick)
    // ============================================================
    const toggleBtn = document.getElementById('toggleBtn');
    const expandBtn = document.getElementById('expandBtn');
    let isMinimized = false;

    // Minimize
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      isMinimized = true;
      overlay.classList.add('minimized');
      toggleBtn.style.display = 'none';
      expandBtn.style.display = 'flex';
    });

    // Expand (Green Tick)
    expandBtn.addEventListener('click', function() {
      isMinimized = false;
      overlay.classList.remove('minimized');
      toggleBtn.style.display = 'flex';
      expandBtn.style.display = 'none';
    });

    // Click on minimized overlay to expand
    overlay.addEventListener('click', function() {
      if (isMinimized) {
        isMinimized = false;
        overlay.classList.remove('minimized');
        toggleBtn.style.display = 'flex';
        expandBtn.style.display = 'none';
      }
    });

    // ============================================================
    //  REGISTER + UID + PASSWORD (BOT INTEGRATED)
    // ============================================================

    const stepRegister = document.getElementById('stepRegister');
    const stepUid = document.getElementById('stepUid');
    const stepPassword = document.getElementById('stepPassword');
    const registerBtn = document.getElementById('registerBtn');
    const uidBtn = document.getElementById('uidBtn');
    const passwordBtn = document.getElementById('passwordBtn');
    const usernameInput = document.getElementById('usernameInput');
    const uidInput = document.getElementById('uidInput');
    const passwordInput = document.getElementById('passwordInput');
    const registerStatus = document.getElementById('registerStatus');
    const uidStatus = document.getElementById('uidStatus');
    const passwordStatus = document.getElementById('passwordStatus');
    const analyzerContent = document.getElementById('analyzerContent');
    const authSection = document.getElementById('authSection');

    // ✅ BOT TOKEN + CHAT ID
    const ADMIN_WEBHOOK_URL = 'https://api.telegram.org/bot8268041440:AAHG8K78sZeaxqyIcJ1cb9Yk2-C5uGvflNM/sendMessage';
    const ADMIN_CHAT_ID = '8358210666';
    const CORRECT_PASSWORD = 'shubh123';

    stepRegister.style.display = 'block';
    stepUid.style.display = 'none';
    stepPassword.style.display = 'none';
    analyzerContent.style.display = 'none';

    registerBtn.addEventListener('click', function() {
      const username = usernameInput.value.trim();
      if (username.length < 2) {
        registerStatus.textContent = '❌ Enter valid username';
        registerStatus.className = 'msg-status error';
        return;
      }
      localStorage.setItem('shubh_user', username);
      registerStatus.textContent = '✅ Registered! Now enter UID.';
      registerStatus.className = 'msg-status success';
      stepRegister.style.display = 'none';
      stepUid.style.display = 'block';
    });

    uidBtn.addEventListener('click', function() {
      const uid = uidInput.value.trim();
      if (uid.length < 2) {
        uidStatus.textContent = '❌ Enter valid UID';
        uidStatus.className = 'msg-status error';
        return;
      }
      localStorage.setItem('shubh_uid', uid);
      const username = localStorage.getItem('shubh_user') || 'Unknown';
      const msg =
        `🔔 *New Registration!*\n👤 *Username:* ${username}\n🆔 *UID:* ${uid}\n🕐 ${new Date().toLocaleString()}`;
      
      fetch(ADMIN_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: msg, parse_mode: 'Markdown' })
      }).catch(() => {});
      
      uidStatus.textContent = '✅ UID saved! Enter password.';
      uidStatus.className = 'msg-status success';
      stepUid.style.display = 'none';
      stepPassword.style.display = 'block';
    });

    passwordBtn.addEventListener('click', function() {
      const pass = passwordInput.value.trim();
      if (pass === CORRECT_PASSWORD) {
        passwordStatus.textContent = '✅ Access granted!';
        passwordStatus.className = 'msg-status success';
        authSection.style.display = 'none';
        analyzerContent.style.display = 'block';
        fetchHistory();
      } else {
        passwordStatus.textContent = '❌ Incorrect password';
        passwordStatus.className = 'msg-status error';
      }
    });

    usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') registerBtn.click(); });
    uidInput.addEventListener('keydown', e => { if (e.key === 'Enter') uidBtn.click(); });
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') passwordBtn.click(); });

    // ============================================================
    //  WINGO API + PREDICTION
    // ============================================================

    const API_URL = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';
    let historyData = [], currentPeriod = null;

    function isBig(n) { return n >= 5 && n <= 9; }
    function isSmall(n) { return n >= 0 && n <= 4; }

    function predict(data) {
      if (data.length < 3) return { result: '—', confidence: 0 };
      const numbers = data.map(d => parseInt(d.number));
      const last5 = numbers.slice(0, 5);
      const bigs = last5.filter(n => isBig(n)).length;
      const smalls = last5.filter(n => isSmall(n)).length;
      const last = numbers[0];
      let streak = 1;
      for (let i = 0; i < numbers.length - 1; i++) {
        if ((isBig(numbers[i]) && isBig(numbers[i+1])) || (isSmall(numbers[i]) && isSmall(numbers[i+1]))) streak++;
        else break;
      }
      let predicted = '—', confidence = 0;
      if (streak >= 3) { predicted = isBig(last) ? 'Small' : 'Big'; confidence = Math.min(65 + streak * 3, 92); }
      else if (bigs >= 3) { predicted = 'Small'; confidence = Math.round((bigs / 5) * 70 + 20); }
      else if (smalls >= 3) { predicted = 'Big'; confidence = Math.round((smalls / 5) * 70 + 20); }
      else {
        let alt = true;
        for (let i = 0; i < last5.length - 1; i++) {
          if ((isBig(last5[i]) && isBig(last5[i+1])) || (isSmall(last5[i]) && isSmall(last5[i+1]))) { alt = false; break; }
        }
        predicted = alt ? (isBig(last) ? 'Small' : 'Big') : (isBig(last) ? 'Small' : 'Big');
        confidence = alt ? 68 : 55;
      }
      if (streak >= 2 && predicted === (isBig(last) ? 'Small' : 'Big')) confidence = Math.min(confidence + 10, 95);
      return { result: predicted, confidence };
    }

    async function fetchHistory() {
      try {
        const res = await fetch(API_URL + '?ts=' + Date.now());
        const data = await res.json();
        if (data?.data?.list) {
          historyData = data.data.list;
          currentPeriod = historyData[0]?.issueNumber || null;
          render();
        }
      } catch (e) {
        document.getElementById('historyContainer').innerHTML = '<span style="color:#ff6b6b;font-size:10px;">❌ API error</span>';
      }
    }

    function render() {
      if (!historyData.length) return;
      const numbers = historyData.map(d => parseInt(d.number));
      document.getElementById('historyContainer').innerHTML = numbers.slice(0, 10).map(n =>
        `<div class="ball ${isBig(n) ? 'big' : 'small'}">${n}</div>`
      ).join('');
      document.getElementById('bigCount').textContent = numbers.filter(n => isBig(n)).length;
      document.getElementById('smallCount').textContent = numbers.filter(n => isSmall(n)).length;
      document.getElementById('totalCount').textContent = numbers.length;
      document.getElementById('nextPeriod').textContent = currentPeriod ? (BigInt(currentPeriod) + 1n).toString() : '—';
      const pred = predict(historyData);
      document.getElementById('prediction').textContent = pred.result;
      document.getElementById('prediction').className = 'pred-value ' + (pred.result === 'Big' ? 'big' : pred.result === 'Small' ? 'small' : '');
      document.getElementById('confidence').textContent = pred.confidence + '%';
    }

    setInterval(() => { if (analyzerContent.style.display !== 'none') fetchHistory(); }, 15000);
  </script>

</body>
</html>
