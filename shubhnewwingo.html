<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shubh AI v1 – Wingo Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0B0B1A;
      color: #FFFFFF;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== MAIN WRAPPER ===== */
    .main-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: #0B0B1A;
      position: relative;
    }

    /* ===== COLOR TRADING SITE (Left) ===== */
    .trading-site {
      flex: 1;
      height: 100vh;
      overflow: hidden;
    }
    .trading-site iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ===== ANALYZER OVERLAY (Right) ===== */
    .analyzer-overlay {
      position: fixed;
      top: 0;
      right: 0;
      width: 340px;
      height: 100vh;
      background: #0B0B1A;
      border-left: 2px solid rgba(0, 255, 195, 0.3);
      box-shadow: -4px 0 30px rgba(0, 255, 195, 0.1);
      z-index: 1000;
      padding: 16px;
      overflow-y: auto;
      transition: transform 0.3s ease;
    }
    .analyzer-overlay.minimized {
      transform: translateX(calc(100% - 48px));
    }

    /* ===== MINIMIZE TOGGLE BUTTON ===== */
    .toggle-btn {
      position: absolute;
      left: -40px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, #00ffc3, #00b894);
      color: #0B0B1A;
      border: none;
      border-radius: 30px 0 0 30px;
      padding: 12px 10px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(0, 255, 195, 0.3);
      writing-mode: vertical-rl;
      letter-spacing: 2px;
    }
    .toggle-btn:hover {
      box-shadow: 0 0 40px rgba(0, 255, 195, 0.5);
    }

    /* ===== REGISTER SECTION ===== */
    .register-section {
      background: rgba(0, 255, 195, 0.04);
      border-radius: 16px;
      padding: 20px 16px;
      border: 1px solid rgba(0, 255, 195, 0.15);
      text-align: center;
      margin-top: 40px;
    }
    .register-section h3 {
      font-size: 16px;
      color: #00ffc3;
      margin-bottom: 4px;
    }
    .register-section p {
      font-size: 13px;
      color: #A7A9BE;
      margin-bottom: 14px;
    }
    .register-section input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 30px;
      border: 1px solid rgba(0, 255, 195, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }
    .register-section input:focus {
      border-color: #00ffc3;
      box-shadow: 0 0 20px rgba(0, 255, 195, 0.2);
    }
    .register-section .neon-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #00ffc3, #00b894);
      color: #0B0B1A;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(0, 255, 195, 0.3);
    }
    .register-section .neon-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(0, 255, 195, 0.5);
    }
    .register-section .msg-status {
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .register-section .msg-status.success {
      color: #00ffc3;
      display: block;
    }
    .register-section .msg-status.error {
      color: #ff6b6b;
      display: block;
    }

    /* ===== ANALYZER CONTENT ===== */
    #analyzerContent {
      display: none;
    }

    /* ===== NEON GLOW ===== */
    .neon-text {
      text-shadow: 0 0 10px rgba(0, 255, 195, 0.5), 0 0 20px rgba(0, 255, 195, 0.3);
    }
    .neon-border {
      border: 1px solid rgba(0, 255, 195, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 195, 0.1);
    }

    /* ===== HEADER ===== */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 255, 195, 0.2);
    }
    .panel-header h1 {
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(135deg, #00ffc3, #00b894);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .panel-header .badge {
      font-size: 9px;
      background: rgba(0, 255, 195, 0.15);
      color: #00ffc3;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 195, 0.3);
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0;
    }
    .stat-card {
      background: rgba(0, 255, 195, 0.04);
      padding: 12px 6px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(0, 255, 195, 0.1);
    }
    .stat-card .num {
      font-size: 22px;
      font-weight: 800;
    }
    .stat-card .num.big { color: #FF8906; }
    .stat-card .num.small { color: #00ffc3; }
    .stat-card .num.total { color: #A7A9BE; }
    .stat-card .label { font-size: 10px; color: #A7A9BE; }

    /* ===== HISTORY ===== */
    .history-box {
      background: rgba(0, 255, 195, 0.03);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid rgba(0, 255, 195, 0.08);
      margin-bottom: 14px;
    }
    .history-box h4 {
      font-size: 12px;
      color: #A7A9BE;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .history-numbers {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .history-numbers .ball {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      background: #2D2D44;
    }
    .history-numbers .ball.small { background: #00ffc3; color: #0B0B1A; }
    .history-numbers .ball.big { background: #FF8906; }

    /* ===== PREDICTION ===== */
    .prediction-box {
      background: linear-gradient(135deg, rgba(0, 255, 195, 0.08), rgba(0, 184, 148, 0.05));
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid rgba(0, 255, 195, 0.2);
      margin-bottom: 14px;
    }
    .prediction-box .pred-label {
      font-size: 11px;
      color: #A7A9BE;
    }
    .prediction-box .pred-value {
      font-size: 36px;
      font-weight: 900;
      margin: 4px 0;
    }
    .prediction-box .pred-value.big { color: #FF8906; }
    .prediction-box .pred-value.small { color: #00ffc3; }
    .prediction-box .pred-confidence {
      font-size: 12px;
      color: #A7A9BE;
    }
    .prediction-box .pred-confidence span {
      color: #00ffc3;
      font-weight: 700;
    }
    .period-info {
      font-size: 11px;
      color: #A7A9BE;
      margin-top: 4px;
    }
    .period-info span { color: #00ffc3; font-weight: 600; }

    /* ===== SCROLLBAR ===== */
    .analyzer-overlay::-webkit-scrollbar {
      width: 3px;
    }
    .analyzer-overlay::-webkit-scrollbar-track {
      background: #0B0B1A;
    }
    .analyzer-overlay::-webkit-scrollbar-thumb {
      background: #00ffc3;
      border-radius: 10px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .analyzer-overlay {
        width: 280px;
      }
      .analyzer-overlay.minimized {
        transform: translateX(calc(100% - 40px));
      }
    }
    @media (max-width: 480px) {
      .analyzer-overlay {
        width: 100%;
        height: 50vh;
        bottom: 0;
        top: auto;
        border-left: none;
        border-top: 2px solid rgba(0, 255, 195, 0.3);
      }
      .analyzer-overlay.minimized {
        transform: translateY(calc(100% - 48px));
      }
      .toggle-btn {
        left: 50%;
        top: -40px;
        transform: translateX(-50%);
        border-radius: 30px 30px 0 0;
        writing-mode: horizontal-tb;
        padding: 6px 20px;
      }
      .trading-site {
        height: 50vh;
      }
    }
  </style>
</head>
<body>

<div class="main-wrapper">

  <!-- ===== COLOR TRADING SITE ===== -->
  <div class="trading-site">
    <iframe src="http://www.tashanwin.cc/#/register?invitationCode=48383155780" allowfullscreen loading="lazy"></iframe>
  </div>

  <!-- ===== ANALYZER OVERLAY ===== -->
  <div class="analyzer-overlay" id="analyzerOverlay">

    <!-- Minimize Toggle Button -->
    <button class="toggle-btn" id="toggleBtn">◀ SHUBH AI</button>

    <!-- Header -->
    <div class="panel-header">
      <h1 class="neon-text">⚡ Shubh AI v1</h1>
      <span class="badge">● LIVE</span>
    </div>

    <!-- ===== REGISTER SECTION ===== -->
    <div class="register-section" id="registerSection">
      <h3>🔐 Register to Unlock</h3>
      <p>Enter your username &amp; notify admin</p>
      <input type="text" id="usernameInput" placeholder="Enter username" />
      <button class="neon-btn" id="registerBtn">Register &amp; Notify Admin</button>
      <div class="msg-status" id="registerStatus"></div>
    </div>

    <!-- ===== ANALYZER CONTENT ===== -->
    <div id="analyzerContent">

      <div class="stats">
        <div class="stat-card">
          <div class="num big" id="bigCount">0</div>
          <div class="label">🔶 Big</div>
        </div>
        <div class="stat-card">
          <div class="num small" id="smallCount">0</div>
          <div class="label">🟢 Small</div>
        </div>
        <div class="stat-card">
          <div class="num total" id="totalCount">0</div>
          <div class="label">📋 Total</div>
        </div>
      </div>

      <div class="history-box">
        <h4>📜 Last Results <span style="color:#00ffc3;font-size:9px;">● LIVE</span></h4>
        <div class="history-numbers" id="historyContainer">
          <span style="color:#A7A9BE;font-size:11px;">Loading...</span>
        </div>
      </div>

      <div class="prediction-box">
        <div class="pred-label">🎯 Next Prediction <span style="font-size:9px;color:#00ffc3;">Shubh AI</span></div>
        <div class="pred-value" id="prediction">—</div>
        <div class="pred-confidence">Confidence: <span id="confidence">0%</span></div>
        <div class="period-info">Next Period: <span id="nextPeriod">—</span></div>
      </div>

    </div><!-- /analyzerContent -->

  </div><!-- /analyzer-overlay -->

</div><!-- /main-wrapper -->

<script>
  // ============================================================
  //  TOGGLE MINIMIZE / OVERLAY
  // ============================================================
  const overlay = document.getElementById('analyzerOverlay');
  const toggleBtn = document.getElementById('toggleBtn');
  let isMinimized = false;

  toggleBtn.addEventListener('click', function() {
    isMinimized = !isMinimized;
    overlay.classList.toggle('minimized', isMinimized);
    toggleBtn.textContent = isMinimized ? '▶ SHUBH AI' : '◀ SHUBH AI';
  });

  // ============================================================
  //  REGISTER + ADMIN NOTIFICATION
  // ============================================================

  const registerSection = document.getElementById('registerSection');
  const usernameInput = document.getElementById('usernameInput');
  const registerBtn = document.getElementById('registerBtn');
  const registerStatus = document.getElementById('registerStatus');
  const analyzerContent = document.getElementById('analyzerContent');

  // 👇 APNA TOKEN AUR CHAT ID YAHAN DALO
  const ADMIN_WEBHOOK_URL = 'https://api.telegram.org/botYOUR_ACTUAL_TOKEN/sendMessage';
  const ADMIN_CHAT_ID = 'YOUR_ACTUAL_CHAT_ID';

  // Check if already registered
  if (localStorage.getItem('shubh_user') === 'true') {
    registerSection.style.display = 'none';
    analyzerContent.style.display = 'block';
    fetchHistory();
  }

  registerBtn.addEventListener('click', function() {
    const username = usernameInput.value.trim();
    if (username.length < 2) {
      registerStatus.textContent = '❌ Please enter a valid username';
      registerStatus.className = 'msg-status error';
      return;
    }

    // Save to local storage
    localStorage.setItem('shubh_user', 'true');
    localStorage.setItem('shubh_username', username);

    // Send message to admin (Telegram)
    const message = `🔔 *New Registration!*\n\n👤 *Username:* ${username}\n🕐 *Time:* ${new Date().toLocaleString()}\n\n✅ Waiting for approval.`;

    fetch(ADMIN_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: ADMIN_CHAT_ID,
        text: message,
        parse_mode: 'Markdown'
      })
    })
    .then(res => {
      if (res.ok) {
        registerStatus.textContent = '✅ Registration sent to admin! Analyzer unlocked.';
        registerStatus.className = 'msg-status success';
        registerSection.style.display = 'none';
        analyzerContent.style.display = 'block';
        fetchHistory();
      } else {
        registerStatus.textContent = '⚠️ Could not reach admin. Please try again.';
        registerStatus.className = 'msg-status error';
      }
    })
    .catch(() => {
      registerStatus.textContent = '⚠️ Network error. Please try again.';
      registerStatus.className = 'msg-status error';
    });
  });

  usernameInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') registerBtn.click();
  });

  // ============================================================
  //  WINGO API + PREDICTION LOGIC
  // ============================================================

  const API_URL = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';

  let historyData = [];
  let currentPeriod = null;

  function isBig(n) { return n >= 5 && n <= 9; }
  function isSmall(n) { return n >= 0 && n <= 4; }

  function rushiPredict(data) {
    if (data.length < 3) return { result: '—', confidence: 0 };

    const numbers = data.map(d => parseInt(d.number));
    const last5 = numbers.slice(0, 5);
    const bigs = last5.filter(n => isBig(n)).length;
    const smalls = last5.filter(n => isSmall(n)).length;
    const last = numbers[0];

    let predicted = '—';
    let confidence = 0;

    let streak = 1;
    for (let i = 0; i < numbers.length - 1; i++) {
      if ((isBig(numbers[i]) && isBig(numbers[i+1])) ||
          (isSmall(numbers[i]) && isSmall(numbers[i+1]))) {
        streak++;
      } else {
        break;
      }
    }

    if (streak >= 3) {
      predicted = isBig(last) ? 'Small' : 'Big';
      confidence = Math.min(65 + streak * 3, 92);
    } else if (bigs >= 3) {
      predicted = 'Small';
      confidence = Math.round((bigs / 5) * 70 + 20);
    } else if (smalls >= 3) {
      predicted = 'Big';
      confidence = Math.round((smalls / 5) * 70 + 20);
    } else {
      let alt = true;
      for (let i = 0; i < last5.length - 1; i++) {
        if ((isBig(last5[i]) && isBig(last5[i+1])) ||
            (isSmall(last5[i]) && isSmall(last5[i+1]))) {
          alt = false;
          break;
        }
      }
      if (alt) {
        predicted = isBig(last) ? 'Small' : 'Big';
        confidence = 68;
      } else {
        predicted = isBig(last) ? 'Small' : 'Big';
        confidence = 55;
      }
    }

    if (streak >= 2 && predicted === (isBig(last) ? 'Small' : 'Big')) {
      confidence = Math.min(confidence + 10, 95);
    }

    return { result: predicted, confidence };
  }

  async function fetchHistory() {
    try {
      const res = await fetch(API_URL + '?ts=' + Date.now());
      const data = await res.json();
      if (data?.data?.list) {
        historyData = data.data.list;
        currentPeriod = historyData[0]?.issueNumber || null;
        render();
      }
    } catch (e) {
      console.error('API Error:', e);
      document.getElementById('historyContainer').innerHTML =
        '<span style="color:#ff6b6b;font-size:11px;">❌ API error</span>';
    }
  }

  function render() {
    if (!historyData.length) return;
    const numbers = historyData.map(d => parseInt(d.number));

    const container = document.getElementById('historyContainer');
    container.innerHTML = numbers.slice(0, 10).map(n =>
      `<div class="ball ${isBig(n) ? 'big' : 'small'}">${n}</div>`
    ).join('');

    document.getElementById('bigCount').textContent = numbers.filter(n => isBig(n)).length;
    document.getElementById('smallCount').textContent = numbers.filter(n => isSmall(n)).length;
    document.getElementById('totalCount').textContent = numbers.length;

    const nextPeriod = currentPeriod ? (BigInt(currentPeriod) + 1n).toString() : '—';
    document.getElementById('nextPeriod').textContent = nextPeriod;

    const pred = rushiPredict(historyData);
    document.getElementById('prediction').textContent = pred.result;
    document.getElementById('prediction').className = 'pred-value ' +
      (pred.result === 'Big' ? 'big' : pred.result === 'Small' ? 'small' : '');
    document.getElementById('confidence').textContent = pred.confidence + '%';
  }

  // Auto refresh every 15 seconds
  setInterval(() => {
    if (analyzerContent.style.display !== 'none') fetchHistory();
  }, 15000);

  if (localStorage.getItem('shubh_user') === 'true') {
    fetchHistory();
  }
</script>

</body>
</html>
